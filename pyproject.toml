[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "agility"
dynamic = ["version"]
description = "Analysis tool for simulations of grain boundaries and interfaces"
authors = [{name = "Alexander Bonkowski", email = "alexander.bonkowski@rwth-aachen.de"}]
maintainers = [{name = "Alexander Bonkowski"}]
dependencies = ["numpy>=1.25", "pandas>=2", "scipy>=1.12", "seaborn>=0.13"]
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["grain boundaries", "interfaces", "science", "analysis"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repo = "https://github.com/ab5424/agility"
Package = "https://pypi.org/project/agility/"

[project.optional-dependencies]
strict = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "seaborn==0.13.2",
]
tests = [
    "pytest-cov>=7",
    "pytest-split>=0.10",
    "pytest>=9",
]
ovito = [
    "ovito>=3.12,<3.17",
]
ase = [
    "ase>=3.25",
]
pymatgen = [
    "pymatgen>=2025",
]
all = ["agility[tests,ovito,ase,pymatgen]"]

[tool.setuptools.dynamic]
version = {"attr" = "agility.__version__"}

[tool.setuptools.packages.find]
include = ["agility", "agility.*"]
exclude = ["tests", "tests.*"]

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["ALL"]
lint.ignore = [
  "ANN002",  # Missing type annotation for `*args`
  "ANN003",  # Missing type annotation for `**kwargs`
  "C901",    # Function is too complex
  "ERA001",  # Found commented-out code
  "FIX002",  # Line contains TODO, consider resolving the issue
  "FBT001",  # Boolean-typed positional argument in function definition
  "FBT002",  # Boolean default positional argument in function definition
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0917", # Too many positional arguments
  "PLR2004", # magic-value-comparison
]
lint.pydocstyle.convention = "google"
lint.isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["CPY001", "S", "T201"]
"docs/**" = [
    "CPY001", # Missing copyright notice at top of file
]
"tests/**" = [
    "CPY001", # Missing copyright notice at top of file
    "S101",   # Use of assert detected
]

[tool.ty.rules]
unresolved-import = "ignore"
possibly-unresolved-reference = "warn"
invalid-type-form = "ignore"

[tool.ty.analysis]
replace-imports-with-any = ["ovito", "ovito.**", "lammps", "lammps.**", "ase", "ase.**", "pymatgen", "pymatgen.**"]

[tool.ty.src]
exclude = ["**/tests", "examples"]

[tool.codespell]
ignore-words-list = [
    "cna",
]
check-filenames = true

[tool.pytest.ini_options]
markers = [
    "unit: mark test as a unit test (uses mocks, no external backend required)",
    "integration: mark test as an integration test (requires an external backend)",
]

[tool.coverage.report]
exclude_lines = [
    'if TYPE_CHECKING:',
]
